# Spring Application
spring.application.name=sentinel-api
# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sentinel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sentinel}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yml
# Redis Data
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# Cassandra Data
spring.cassandra.contact-points=${SPRING_DATA_CASSANDRA_CONTACT_POINTS:localhost}
spring.cassandra.port=${SPRING_DATA_CASSANDRA_PORT:9042}
spring.cassandra.keyspace-name=${SPRING_DATA_CASSANDRA_KEYSPACE:sentinel}
spring.cassandra.username=${SPRING_DATA_CASSANDRA_USERNAME:cassandra}
spring.cassandra.password=${SPRING_DATA_CASSANDRA_PASSWORD:cassandra}
spring.cassandra.local-datacenter=${SPRING_DATA_CASSANDRA_DATACENTER:datacenter1}
# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
# Server
server.port=8080
# Custom Sentinel Properties
sentinel.jwt.secret=${JWT_SECRET:sentinel-dev-secret-key-must-be-at-least-256-bits-long!!}
sentinel.jwt.access-token-ttl=PT15M
sentinel.jwt.refresh-token-ttl=PT2H
sentinel.cookie.refresh-token-name=refresh_token
sentinel.cookie.path=/api/auth
sentinel.cookie.secure=${COOKIE_SECURE:false}
sentinel.cookie.same-site=Lax
# Actuator / Management
management.endpoints.web.exposure.include=health,info,metrics,threaddump
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true
management.metrics.web.server.request.autotime.enabled=true
# Monitor Urls
sentinel.monitor.server-url=http://localhost:8080
sentinel.monitor.ingest-url=http://localhost:8081
sentinel.monitor.processor-url=http://localhost:8082
sentinel.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
