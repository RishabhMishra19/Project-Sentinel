# Spring Application
spring.application.name=sentinel-processor
# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sentinel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sentinel}
spring.datasource.hikari.maximum-pool-size=${SENTINEL_PROCESSOR_DB_POOL_SIZE:32}
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Cassandra Data
spring.cassandra.contact-points=${SPRING_DATA_CASSANDRA_CONTACT_POINTS:localhost}
spring.cassandra.port=${SPRING_DATA_CASSANDRA_PORT:9042}
spring.cassandra.keyspace-name=${SPRING_DATA_CASSANDRA_KEYSPACE:sentinel}
spring.cassandra.username=${SPRING_DATA_CASSANDRA_USERNAME:cassandra}
spring.cassandra.password=${SPRING_DATA_CASSANDRA_PASSWORD:cassandra}
spring.cassandra.local-datacenter=${SPRING_DATA_CASSANDRA_DATACENTER:datacenter1}
# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=60s
# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=sentinel-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=batch
spring.kafka.listener.type=batch
spring.kafka.listener.concurrency=${SENTINEL_PROCESSOR_CONCURRENCY:1}
spring.kafka.streams.application-id=sentinel-analytics
spring.kafka.streams.state-dir=/tmp/sentinel-kafka-streams
spring.kafka.streams.properties.auto.offset.reset=earliest
# Server
server.port=8082
# Actuator / Management
management.endpoints.web.exposure.include=health,info,metrics,threaddump
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.metrics.tags.application=${spring.application.name}
management.health.db.enabled=true
management.metrics.web.server.request.autotime.enabled=true
management.metrics.distribution.percentiles-histogram.sentinel.ingest.http=true
management.metrics.distribution.percentiles.sentinel.ingest.http=0.5,0.95,0.99
management.metrics.distribution.slo.sentinel.ingest.http=10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s

# kafka
sentinel.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
sentinel.kafka.topic.partitions=3
sentinel.kafka.topic.replication-factor=1
sentinel.kafka.request-logs-topic=sentinel.request-logs

# logging
logging.level.root=WARN

logging.level.com.sentinel=INFO
logging.level.com.sentinel.processor.kafka.stream.AnalyticsStreamUtils=INFO
logging.level.org.apache.kafka.streams.kstream.internals.KStreamWindowAggregate=ERROR

