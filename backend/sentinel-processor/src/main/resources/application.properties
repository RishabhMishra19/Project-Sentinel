# Spring Application
spring.application.name=sentinel-processor

# Cassandra Data Configuration
spring.cassandra.contact-points=${SPRING_DATA_CASSANDRA_CONTACT_POINTS:localhost}
spring.cassandra.port=${SPRING_DATA_CASSANDRA_PORT:9042}
spring.cassandra.keyspace-name=${SPRING_DATA_CASSANDRA_KEYSPACE:sentinel}
spring.cassandra.username=${SPRING_DATA_CASSANDRA_USERNAME:cassandra}
spring.cassandra.password=${SPRING_DATA_CASSANDRA_PASSWORD:cassandra}
spring.cassandra.local-datacenter=${SPRING_DATA_CASSANDRA_DATACENTER:datacenter1}
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=60s

# kafka
# ===================================================================
# Cluster Infrastructure & Topology Shared Settings
# ===================================================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.topic.partitions=1
spring.kafka.topic.replication-factor=1

# ===================================================================
# Standard Consumer Configuration (for @KafkaListener)
# ===================================================================
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
# Corresponds to KafkaConstants.CONSUMER_BATCH_SIZE
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Listener Container Infrastructure Settings
spring.kafka.listener.ack-mode=batch
spring.kafka.listener.type=batch
spring.kafka.listener.concurrency=${SENTINEL_PROCESSOR_CONCURRENCY:1}

# ===================================================================
# Kafka Streams Topologies Configuration
# ===================================================================
spring.kafka.streams.application-id=sentinel-analytics
spring.kafka.streams.state-dir=/tmp/sentinel-kafka-streams
spring.kafka.streams.properties.auto.offset.reset=earliest
spring.kafka.streams.properties.poll.ms=100
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.ensure.explicit.internal.resource.naming=true

# Exception Handling Strategies
spring.kafka.streams.properties.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndFailExceptionHandler
spring.kafka.streams.properties.processing.exception.handler=org.apache.kafka.streams.errors.LogAndFailProcessingExceptionHandler
spring.kafka.streams.properties.production.exception.handler=org.apache.kafka.streams.errors.DefaultProductionExceptionHandler

# Transaction and Processing Commit Settings
spring.kafka.streams.properties.processing.guarantee=exactly_once_v2
# Overridden from 3000 to match your strict latency requirements for EOS v2
spring.kafka.streams.properties.commit.interval.ms=100


# Server
server.port=8082

# Actuator / Management
management.endpoints.web.exposure.include=health,info,metrics,threaddump
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.metrics.tags.application=${spring.application.name}
management.health.db.enabled=true
management.metrics.web.server.request.autotime.enabled=true
management.metrics.distribution.percentiles-histogram.sentinel.ingest.http=true
management.metrics.distribution.percentiles.sentinel.ingest.http=0.5,0.95,0.99
management.metrics.distribution.slo.sentinel.ingest.http=10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s

# logging
logging.level.org.apache.kafka=OFF
