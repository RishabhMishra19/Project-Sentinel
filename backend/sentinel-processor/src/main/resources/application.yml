spring:
  application:
    name: sentinel-processor
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${SPRING_DATASOURCE_USERNAME:sentinel}
    password: ${SPRING_DATASOURCE_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: ${SENTINEL_PROCESSOR_DB_POOL_SIZE:32}
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  cassandra:
    contact-points: ${SPRING_DATA_CASSANDRA_CONTACT_POINTS:localhost}
    port: ${SPRING_DATA_CASSANDRA_PORT:9042}
    keyspace-name: ${SPRING_DATA_CASSANDRA_KEYSPACE:sentinel}
    username: ${SPRING_DATA_CASSANDRA_USERNAME:cassandra}
    password: ${SPRING_DATA_CASSANDRA_PASSWORD:cassandra}
    local-datacenter: ${SPRING_DATA_CASSANDRA_DATACENTER:datacenter1}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=60s
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      group-id: sentinel-processor
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: batch
      type: batch
      concurrency: ${SENTINEL_PROCESSOR_CONCURRENCY:1}
    streams:
      application-id: sentinel-analytics

sentinel:
  kafka:
    request-logs-topic: sentinel.request-logs

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    db:
      enabled: true
