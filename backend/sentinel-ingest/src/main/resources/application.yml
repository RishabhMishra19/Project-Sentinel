spring:
  application:
    name: sentinel-ingest
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${SPRING_DATASOURCE_USERNAME:sentinel}
    password: ${SPRING_DATASOURCE_PASSWORD:sentinel}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=60s
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"
      properties:
        linger.ms: 20
        batch.size: 65536
  cassandra:
    contact-points: ${SPRING_DATA_CASSANDRA_CONTACT_POINTS:localhost}
    port: ${SPRING_DATA_CASSANDRA_PORT:9042}
    keyspace-name: ${SPRING_DATA_CASSANDRA_KEYSPACE:sentinel}
    username: ${SPRING_DATA_CASSANDRA_USERNAME:cassandra}
    password: ${SPRING_DATA_CASSANDRA_PASSWORD:cassandra}
    local-datacenter: ${SPRING_DATA_CASSANDRA_DATACENTER:datacenter1}
sentinel:
  kafka:
    request-logs-topic: sentinel.request-logs
    request-logs-partitions: 1
    request-logs-replicas: 1
  memcached:
    host: ${MEMCACHED_HOST:localhost}
    port: ${MEMCACHED_PORT:11211}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    db:
      enabled: true
