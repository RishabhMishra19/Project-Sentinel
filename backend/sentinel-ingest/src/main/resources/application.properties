# Spring Application
spring.application.name=sentinel-ingest

# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sentinel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sentinel}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=60s

# ===================================================================
# Unified Kafka Configuration
# ===================================================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.topic.partitions=1
spring.kafka.topic.replication-factor=1
spring.kafka.streams.state-dir=/tmp/sentinel-kafka-streams

# Producer Core Properties
spring.kafka.producer.acks=1
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.batch.size=500

# Serializer Migrations (Swapped value-serializer to Spring's JsonSerializer)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ===================================================================
# Cassandra Data
# ===================================================================
spring.cassandra.contact-points=${SPRING_DATA_CASSANDRA_CONTACT_POINTS:localhost:9042}
spring.cassandra.keyspace-name=${SPRING_DATA_CASSANDRA_KEYSPACE:sentinel}
spring.cassandra.username=${SPRING_DATA_CASSANDRA_USERNAME:cassandra}
spring.cassandra.password=${SPRING_DATA_CASSANDRA_PASSWORD:cassandra}
spring.cassandra.local-datacenter=${SPRING_DATA_CASSANDRA_DATACENTER:datacenter1}

# Custom Sentinel Properties
sentinel.memcached.host=${MEMCACHED_HOST:localhost}
sentinel.memcached.port=${MEMCACHED_PORT:11211}
sentinel.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Server
server.port=8081

# Actuator / Management
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.metrics.tags.application=${spring.application.name}
management.health.db.enabled=true
management.metrics.web.server.request.autotime.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

