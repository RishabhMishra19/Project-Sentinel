services:
  kafka-2:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: kafka-2

    ports:
      # Host:Container
      # Host uses 9094 because 9092 is already used by kafka-1.
      - "9093:9092"

    environment:
      # Unique ID for this broker/controller.
      KAFKA_NODE_ID: 2

      # Broker + KRaft controller.
      KAFKA_PROCESS_ROLES: broker,controller

      # Same 3-node KRaft controller quorum.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 9092 -> Kafka broker/client traffic
      # 9093 -> KRaft controller traffic
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      # Other Docker containers use kafka-2:9092.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Internal Kafka topics.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka-2-data:/var/lib/kafka/data

volumes:
  kafka-2-data:
