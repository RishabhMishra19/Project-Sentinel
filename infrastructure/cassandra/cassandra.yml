services:
    cassandra:
        image: cassandra:5.0
        container_name: cassandra

        ports:
            - "9042:9042"

        environment:
            CASSANDRA_CLUSTER_NAME: sentinel-cluster

            CASSANDRA_DC: datacenter1
            CASSANDRA_RACK: rack1

            CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch

            CASSANDRA_AUTHENTICATOR: PasswordAuthenticator

            # Keep Cassandra's JVM memory reasonable for local development.
            MAX_HEAP_SIZE: 2G
            HEAP_NEWSIZE: 512M

        volumes:
            - cassandra-data:/var/lib/cassandra

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "cqlsh -e 'SELECT now() FROM system.local;' 127.0.0.1 9042",
                ]
            interval: 10s
            timeout: 10s
            retries: 20
            start_period: 60s

volumes:
    cassandra-data:
