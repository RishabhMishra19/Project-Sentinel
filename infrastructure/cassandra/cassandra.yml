services:
  cassandra:
    image: cassandra:5.0

    ports:
      # CQL native protocol
      # Host:Container
      - "9042:9042"

    environment:
      # Name of the Cassandra cluster.
      CASSANDRA_CLUSTER_NAME: sentinel-cluster

      # Single-node development cluster.
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1

      # Disable Cassandra's legacy snitch behavior for a
      # simple local development setup.
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch

    volumes:
      # Persist Cassandra data.
      - cassandra-data:/var/lib/cassandra

    healthcheck:
      # Check whether Cassandra is accepting CQL connections.
      test:
        [
          "CMD-SHELL",
          "cqlsh -e 'SELECT now() FROM system.local;' 127.0.0.1 9042",
        ]

      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ============================================================
  # Cassandra schema initialization
  # ============================================================
  cassandra-init:
    image: cassandra:5.0

    depends_on:
      cassandra:
        condition: service_healthy

    volumes:
      # Mount our CQL initialization scripts.
      - ./init:/init:ro

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        echo "Waiting for Cassandra..."
        until cqlsh cassandra 9042 -e "SELECT now() FROM system.local;" > /dev/null 2>&1; do
          sleep 5
        done

        echo "Cassandra is ready."
        echo "Running initialization scripts..."

        for file in /init/*.cql; do
          echo "Executing $$file..."
          cqlsh cassandra 9042 -f "$$file"
        done

        echo "Cassandra initialization completed."

    restart: "no"

volumes:
  cassandra-data:
