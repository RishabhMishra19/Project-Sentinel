global:
    scrape_interval: 1s
    evaluation_interval: 1s

scrape_configs:
    - job_name: ingest
      metrics_path: /actuator/prometheus
      static_configs:
          - targets:
                - host.docker.internal:8081
    - job_name: processor
      metrics_path: /actuator/prometheus
      static_configs:
          - targets:
                - host.docker.internal:8082
