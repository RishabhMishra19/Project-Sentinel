server {
    listen 80;
    server_name localhost;

    # 1. Route everything else to your local frontend dev server (e.g., Vite on 5173)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # Essential for Vite HMR (Hot Module Replacement)
        proxy_set_header Host $host;
    }

    # 2. Route Main Spring Boot App
    location /server/main/ {
        rewrite ^/server/main(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Route Ingest Spring Boot App
    location /server/ingest/ {
        rewrite ^/server/ingest(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Route Processor Spring Boot App
    location /server/processor/ {
        rewrite ^/server/processor(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}